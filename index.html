<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mijn AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <div class="logo">
                Mijn AI
            </div>

            <button class="new-chat">
                + Nieuwe chat
            </button>

            <div class="chat-history">

                <p class="history-title">
                    Recente chats
                </p>

                <button class="history-item">
                    Mijn eerste gesprek
                </button>

            </div>

        </aside>


        <main class="chat">

            <header class="topbar">
                <h2>Mijn AI</h2>
            </header>


            <section class="messages" id="messages">

                <div class="welcome">

                    <h1>
                        Waar kan ik je mee helpen?
                    </h1>

                    <p>
                        Stel een vraag of kies een voorbeeld.
                    </p>

                    <div class="suggestions">

                        <button class="suggestion">
                            Leg quantumcomputers simpel uit
                        </button>

                        <button class="suggestion">
                            Help me een website bouwen
                        </button>

                        <button class="suggestion">
                            Geef me ideeën voor een bedrijf
                        </button>

                        <button class="suggestion">
                            Schrijf een professionele e-mail
                        </button>

                    </div>

                </div>

            </section>


            <div class="input-area">

                <div class="input-box">

                    <textarea
                        id="messageInput"
                        placeholder="Stuur een bericht..."
                        rows="1"
                    ></textarea>

                    <button id="sendButton">
                        ↑
                    </button>

                </div>

                <p class="disclaimer">
                    AI kan fouten maken. Controleer belangrijke informatie.
                </p>

            </div>

        </main>

    </div>

    <script src="script.js"></script>

</body>

</html>
